name: vizxr
description: "Vizxr — High-fidelity Kubernetes IDE for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  kubernetes: ^0.1.0
  dartssh2: ^2.1.0
  xterm: ^3.4.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
